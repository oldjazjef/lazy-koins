# Production deploys the images that were built and tested for a commit of main. No rebuild: production
# runs exactly what test ran. Approval: required reviewers on the "production" environment.
#
# Two ways to release:
# - Actions → Deploy production → Run workflow (on main, also from GitHub Mobile): creates the next
#   release vX.Y.Z for the newest commit of main (next patch/minor/major, or an exact version), then
#   deploys it in the same run.
#   (A release created with GITHUB_TOKEN doesn't trigger other workflows, so it can't rely on `release`.)
# - Publish a GitHub release (tag vX.Y.Z on a commit of main) by hand.
#
# Either way the same run also builds the desktop app (Windows + macOS, `_desktop.yml`) and attaches
# the installers to the release. That job needs only the release, not the production approval, and
# the release notes get an install note for the (still unsigned) desktop app.
name: Deploy production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead (e.g. v1.2.3), optional
        type: string
        default: ''

# Minimal by default; every job asks for what it needs. A reusable workflow never gets more than
# the calling job grants.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read # was this commit deployed to test?
      contents: write # create the release, append the desktop notes
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source-tag: sha-${{ github.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = release ]; then
            tag="$RELEASE_TAG"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow on main (got $GITHUB_REF)."
            exit 1
          elif [ -n "$VERSION" ]; then
            tag="v${VERSION#v}"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            IFS=. read -r major minor patch <<<"${latest:-v0.0.0}"
            major="${major#v}"
            case "$BUMP" in
              major) tag="v$((major + 1)).0.0" ;;
              minor) tag="v$major.$((minor + 1)).0" ;;
              *) tag="v$major.$minor.$((patch + 1))" ;;
            esac
            echo "Latest release: ${latest:-none}, next: $tag"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got $tag)"
            exit 1
          fi
          if [ "$EVENT" != release ] && git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The images of this commit exist (and were tested) only once "Deploy test" succeeded for it.
      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          deployed="$(gh run list --workflow deploy-test.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$deployed" = 0 ]; then
            echo "::error::Commit $GITHUB_SHA has no successful \"Deploy test\" run yet. Wait for it, then run this again."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # Both paths (hand-published release and "Run workflow"): explain the unsigned desktop app.
      # Idempotent: a re-run finds the marker and leaves the notes alone.
      - name: Desktop install notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          marker='<!-- lazykoins-desktop-notes -->'
          body="$(gh release view "$TAG" --json body --jq .body)"
          if grep -qF -- "$marker" <<<"$body"; then
            echo "Release $TAG already has the desktop install notes."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          {
            if [ -n "$body" ]; then printf '%s\n\n' "$body"; fi
            echo "$marker"
            cat <<'EOF'
          ## Desktop-App / Desktop app

          **Deutsch.** Die Installationsdateien erscheinen einige Minuten nach der Veröffentlichung unten
          unter _Assets_: `lazy-koins-Setup-<Version>.exe` (Windows), `lazy-koins-<Version>-arm64.dmg`
          (Mac mit Apple-Chip) und `lazy-koins-<Version>-x64.dmg` (Mac mit Intel-Chip). Die App ist noch
          **nicht signiert**, deshalb warnt das Betriebssystem beim ersten Start:

          - **Windows (SmartScreen):** «Der Computer wurde durch Windows geschützt» → **Weitere
            Informationen** → **Trotzdem ausführen**.
          - **macOS (Gatekeeper):** Die App aus dem DMG in «Programme» ziehen, dann im Finder mit der
            rechten Maustaste (oder Ctrl-Klick) auf die App → **Öffnen** → im Dialog nochmals **Öffnen**.
            Alternativ im Terminal: `xattr -dr com.apple.quarantine "/Applications/lazy-koins.app"`

          **English.** The installers appear under _Assets_ below a few minutes after publishing:
          `lazy-koins-Setup-<version>.exe` (Windows), `lazy-koins-<version>-arm64.dmg` (Apple silicon)
          and `lazy-koins-<version>-x64.dmg` (Intel Mac). The app is **not signed** yet, so the
          operating system warns on the first start:

          - **Windows (SmartScreen):** "Windows protected your PC" → **More info** → **Run anyway**
            (German Windows: «Weitere Informationen» → «Trotzdem ausführen»).
          - **macOS (Gatekeeper):** drag the app from the DMG into Applications, then right-click (or
            Ctrl-click) the app in Finder → **Open** → **Open** again in the dialog. Or in Terminal:
            `xattr -dr com.apple.quarantine "/Applications/lazy-koins.app"`
          EOF
          } > "$notes"
          gh release edit "$TAG" --notes-file "$notes"

  deploy:
    needs: release
    permissions:
      contents: read
      packages: write # re-tag the images
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      source-tag: ${{ needs.release.outputs.source-tag }}
      release-tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Needs the release only, not `deploy`: installers don't wait for the production approval.
  desktop:
    needs: release
    permissions:
      contents: write # upload the installers to the release
    uses: ./.github/workflows/_desktop.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
