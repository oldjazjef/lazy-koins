server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api is proxied to the API container, so the web app stays origin-relative (apiBaseUrl '')
    # and needs no CORS. Mirrors proxy.conf.json in development.
    location /api/ {
        # Exchange exports are uploaded through here (F5.1); nginx's default is 1 MB.
        client_max_body_size 50m;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every route is served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cached: the entry point (or browsers keep a build whose chunks are gone), the runtime
    # config (rewritten on every start) and the message files (not hashed).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }
}
