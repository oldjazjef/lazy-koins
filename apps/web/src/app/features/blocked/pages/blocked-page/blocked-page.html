<main class="flex min-h-screen items-center justify-center p-6">
  <section class="lk-panel flex max-w-md flex-col gap-4 p-6" role="alert">
    <h1 class="text-xl font-semibold">{{ 'blocked.title' | translate }}</h1>
    <p class="text-muted-foreground">{{ 'blocked.text' | translate }}</p>
    @if (hasAccount) {
    <button hlmBtn type="button" (click)="signOut()">
      {{ 'blocked.signOut' | translate }}
    </button>
    }
  </section>
</main>
