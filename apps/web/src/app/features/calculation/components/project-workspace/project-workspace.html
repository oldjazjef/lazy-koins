<nav
  class="mb-4 flex flex-wrap gap-1 border-b"
  role="tablist"
  [attr.aria-label]="'workspace.label' | translate"
>
  @for (tab of tabs; track tab) {
  <button
    type="button"
    role="tab"
    class="lk-tab"
    [class.lk-tab-active]="service.tab() === tab"
    [attr.aria-selected]="service.tab() === tab"
    (click)="select(tab)"
  >
    {{ 'workspace.tabs.' + tab | translate }}
  </button>
  }
</nav>

<div role="tabpanel">
  @switch (service.tab()) { @case ('files') {
  <lk-project-files
    class="flex flex-col gap-6"
    [projectId]="projectId()"
    [closed]="closed()"
  />
  } @case ('rates') {
  <lk-project-rates [closed]="closed()" [taxYear]="taxYear()" />
  } @case ('result') {
  <lk-project-result [closed]="closed()" />
  } @case ('checks') {
  <lk-project-checks [closed]="closed()" />
  } @case ('corrections') {
  <lk-project-corrections [closed]="closed()" [taxYear]="taxYear()" />
  } @case ('exports') {
  <lk-project-exports />
  } }
</div>

<!-- F7.5: the records behind a figure, with file and row -->
<lk-records-dialog
  [title]="service.recordsOf()?.title ?? null"
  [data]="service.records()"
  (closed)="service.closeRecords()"
/>
