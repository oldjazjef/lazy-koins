<nav
  class="mb-4 flex flex-wrap gap-1 border-b"
  role="tablist"
  [attr.aria-label]="'workspace.label' | translate"
>
  @for (tab of tabs; track tab) {
  <button
    type="button"
    role="tab"
    class="lk-tab"
    [class.lk-tab-active]="service.tab() === tab"
    [attr.aria-selected]="service.tab() === tab"
    (click)="select(tab)"
  >
    {{ 'workspace.tabs.' + tab | translate }} @if (tab === 'hints' &&
    files.openHints() > 0) {
    <span
      class="bg-primary text-primary-foreground ml-1 inline-flex min-w-5 items-center justify-center rounded-full px-1.5 text-xs tabular-nums"
      [attr.aria-label]="'hints.badge' | translate: { count: files.openHints() }"
      >{{ files.openHints() }}</span
    >
    }
  </button>
  }
</nav>

<div role="tabpanel">
  @switch (service.tab()) { @case ('files') {
  <lk-project-files
    class="flex flex-col gap-6"
    [projectId]="projectId()"
    [closed]="closed()"
    (showHints)="showHints(null)"
  />
  } @case ('hints') {
  <lk-project-hints
    [closed]="closed()"
    [openItems]="openItems()"
    (manualHolding)="manualHolding($event)"
    (showChecks)="select('checks')"
    (showFiles)="select('files')"
  />
  } @case ('wallets') {
  <lk-project-wallets [projectId]="projectId()" [closed]="closed()" />
  } @case ('rates') {
  <lk-project-rates [closed]="closed()" [taxYear]="taxYear()" />
  } @case ('result') {
  <lk-project-result [closed]="closed()" />
  } @case ('checks') {
  <lk-project-checks [closed]="closed()" (showHints)="showHints($event)" />
  } @case ('corrections') {
  <lk-project-corrections [closed]="closed()" [taxYear]="taxYear()" />
  } @case ('exports') {
  <lk-project-exports />
  } }
</div>

<!-- The AI dialogs (F5.13), started from the files area or from a hint -->
<lk-ai-assist />

<!-- F7.5: the records behind a figure, with file and row -->
<lk-records-dialog
  [title]="service.recordsOf()?.title ?? null"
  [data]="service.records()"
  (closed)="service.closeRecords()"
/>
